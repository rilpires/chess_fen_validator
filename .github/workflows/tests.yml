name: Tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Build and run tests.cpp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile tests
        run: g++ -std=c++17 -Wall -Wextra -o tests tests.cpp

      - name: Run tests
        run: ./tests
